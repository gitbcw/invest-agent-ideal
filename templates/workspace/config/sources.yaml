# 用户可配置的信息源。复盘中需要记录来源,并持续验证可靠性。
#
# 注意:本文件只描述**业务语义**的信息源分类与可靠性级别(给 skill / 复盘 / 证据归档用)。
# Provider 实现细节(endpoint URL / confidence / category)是服务层契约,所有 workspace 共享,
# 权威表在 src/services/market-data-providers.ts,不在 workspace 内。
#
# 数据源运行状态遥测(source_telemetry_event)与 provider 质量汇总属于服务层可观测/可评测资产:
# - data/source-telemetry/YYYY-MM-DD.jsonl
# - data/source-quality/YYYY-MM-DD.{md,json,jsonl}
# 它们不进入 workspace。workspace 只记录与某次投资判断直接相关的信息源使用/缺失/冲突事件。
minimum_source_set:
  required_for_mvp:
    - "A 股实时/延时行情"
    - "指数行情"
    - "ETF 行情"
    - "公司公告"
    - "财报数据"
    - "交易日历"
    - "用户持仓成本和数量"
  required_for_p1:
    - "行业/主题分类"
    - "新闻政策源"
  priority_order:
    - "行情"
    - "公告"
    - "财报"
    - "交易日历"
    - "新闻政策"
    - "研报"

# 业务语义分类,给 skill / 复盘 / 证据归档使用。
# 与服务层 provider 解耦:这里描述的是"用户视角的信息源类别",而非具体 endpoint。
source_classes:
  market_price:
    reliability: "verified_market"
    failure_policy: "不输出精确价格结论"
  index_price:
    reliability: "verified_market"
    failure_policy: "不输出指数涨跌驱动结论"
  etf_price:
    reliability: "verified_market"
    failure_policy: "不输出 ETF 触发区间结论"
  announcement:
    reliability: "preferred_primary"
    failure_policy: "不触发公告类 P0/P1 判断"
  primary_report:
    reliability: "preferred_primary"
    failure_policy: "提示缺少官方财报,不做确定性财务结论"
  trading_calendar:
    reliability: "preferred_primary"
    failure_policy: "无法判断自动任务是否应在交易日执行"
  industry_theme:
    reliability: "secondary"
    usage_boundary: "用于集中度、主题暴露和观察池筛选"
  news_policy:
    reliability: "secondary"
    cross_check_required: true
  research:
    reliability: "secondary"
    usage_boundary: "只能辅助判断,不能单独作为关键买卖证据"

source_audit_rule_path: "knowledge/source_audit.md"
# 业务语义的 source_event(used/conflict/missing/stale...)仍写到此 jsonl;
# 技术遥测 source_telemetry_event 不在此文件,改写到服务层 data/source-telemetry/
source_event_output: "memory/source_events.jsonl"
