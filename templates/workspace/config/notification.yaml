# 用户通知偏好。用户只在低打扰、积极盯盘、晚间汇总中选择一项。
user_mode: working_professional

preference:
  mode: "low_disturbance"
  label: "低打扰"
  description: "盘中不主动推送普通信息，减少不必要打扰。"

preference_options:
  low_disturbance:
    label: "低打扰"
    description: "盘中不主动推送普通信息，减少不必要打扰。"
  active_watch:
    label: "积极盯盘"
    description: "在每个盘中简报时间推送持仓与市场摘要。"
  evening_summary:
    label: "晚间汇总"
    description: "盘中不主动推送，晚上统一查看复盘和关注事项。"

working_hours:
  start: "09:00"
  end: "18:00"
  policy: "实际推送由用户选择的通知偏好决定。"

lunch_break:
  start: "11:30"
  end: "13:30"
  policy: "不改变用户选择的通知偏好。"

evening:
  daily_brief_time: "19:00"
  policy: "推送日复盘简报和今日是否需要操作。"

weekend:
  weekly_meeting_time: "Saturday 09:00"
  policy: "推送周末 10 分钟投资会议简报。"

do_not_disturb:
  enabled: true
  allow_p0_override: false

custom_rules: []
last_confirmed_at: null
