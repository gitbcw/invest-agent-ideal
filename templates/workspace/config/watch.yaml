# 盘中定时简报配置。
# 本文件不是明确规则巡检的落库位置；可执行价格/均线/指标规则必须写入服务层 alert_rules。
mode: default
only_push_on_exception: true
priority_policy: "用户通知偏好只在低打扰、积极盯盘、晚间汇总中选择；风险等级不决定推送方式。"
purpose_boundary: "盘中简报用于按固定时间汇总市场与持仓状态；明确规则巡检用于执行 alert_rules；二者都不用于制造连续行情陪伴。"

exception_rules:
  - "核心持仓接近用户设定的买入区或减仓区。"
  - "观察仓进入用户设定的配置区。"
  - "非核心持仓进入反弹优化窗口或跌破保护条件。"
  - "持仓、行业或指数走势与日复盘核心判断明显相反。"
  - "重大新闻、财报、政策或商品价格变化影响持仓逻辑。"
  - "用户自定义的涨跌幅、成交量、估值或技术面阈值被触发。"

non_exception_rules:
  - "普通涨跌但未接近用户规则区间。"
  - "无可靠来源的传闻或未核验消息。"
  - "只与短线情绪相关、不能改变持仓逻辑的信息。"
  - "重复触发但没有新增证据的同类提醒。"

deduplication:
  idempotency_key: "tenant_id + target_code + alert_type + trigger + trading_day"
  suppress_same_alert_minutes: 120
  max_intraday_pushes_per_target: 1

custom_rules: []
required_output_fields:
  - "priority"
  - "trigger"
  - "fact"
  - "inference"
  - "user_action_needed"
  - "evidence"
  - "next_review_time"
last_confirmed_at: null
