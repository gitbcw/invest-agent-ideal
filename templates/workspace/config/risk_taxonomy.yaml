# 投资风险分类。用于日复盘、周复盘、月复盘、财报分析和盯盘的分析排序，不决定通知推送方式。
risk_levels:
  P0:
    meaning: "可能改变持仓逻辑、触发用户确认动作或造成重大本金风险"
  P1:
    meaning: "当天需要关注，但不适合打断工作"
  P2:
    meaning: "用于复盘沉淀，不主动推送"

risk_categories:
  portfolio:
    - "单一标的集中度"
    - "单一行业或主题暴露"
    - "现金安全垫不足"
    - "核心/非核心/观察仓角色漂移"
  market_structure:
    - "流动性恶化"
    - "风格快速切换"
    - "相关性在极端行情中上升"
    - "估值分位极端"
  asset_specific:
    - "基本面恶化"
    - "财报质量下降"
    - "治理或监管风险"
    - "停牌、退市、清盘或信用风险"
  product_specific:
    - "ETF 跟踪误差"
    - "基金规模过小或清盘风险"
    - "可转债强赎、信用和溢价率风险"
    - "港股通汇率和流动性风险"
    - "黄金/商品价格与汇率联动风险"
  behavior:
    - "追高"
    - "频繁短线查询"
    - "临时修改规则"
    - "忽略现金安全垫"
    - "因为单日涨跌改变长期判断"
  data_quality:
    - "行情延迟"
    - "财报缺失"
    - "新闻未核验"
    - "来源冲突"

classification_required_fields:
  - "risk_category"
  - "risk_item"
  - "priority"
  - "evidence"
  - "portfolio_impact"
  - "user_action_needed"
