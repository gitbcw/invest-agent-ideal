# L3a 规则树复合指标
#
# 本文件存放**标准指标 + 标准信号的布尔/加权组合**(L3a 层)。
# 不涉及循环/递归/复杂状态的复合指标请走 L3b 沙箱脚本。
#
# 完整规范见 docs/composite-indicator-system.md 第 7 节。
#
# 可用 source(2026-06-22):
#   signal.*           — builtin 巡检信号(下划线格式,值是 boolean)
#     - signal.ma_breakout_above       突破 MA(period 默认 20)
#     - signal.ma_breakout_below       跌破 MA
#     - signal.macd_golden_cross       MACD 金叉
#     - signal.macd_death_cross        MACD 死叉
#     - signal.kdj_oversold            KDJ 超卖反弹
#     - signal.kdj_overbought          KDJ 超买回落
#     - signal.breakout_with_volume    放量突破预案压力位
#   indicator.*        — L1 算子当前值(下划线格式,值是 number)
#     - indicator.volume_ratio         量比(/ 5 日均量)
#     - indicator.ma20                 MA20
#     - indicator.macd_dif / macd_dea  MACD DIF/DEA
#     - indicator.rsi                  RSI(6)
#     - indicator.kdj_d / kdj_k / kdj_j  KDJ 三线

- key: macd_volume_combo
  name: "MACD 金叉且量比放大"
  description: "MACD 金叉同时量比大于 1.5(启动信号 + 量能确认)"
  reliability: stable
  type: rule_tree
  inputs:
    - key: macd_signal
      source: signal.macd_golden_cross
      transform: boolean
    - key: volume_ratio
      source: indicator.volume_ratio
      transform: number
  combine: and
  thresholds:
    trigger: { expr: "macd_signal && volume_ratio > 1.5" }
  outputs:
    triggered: boolean
    score: number
  schedule: intraday
  user_acknowledged: true
  acknowledged_at: "2026-06-22"

- key: oversold_bounce
  name: "超卖反弹(KDJ + RSI 双确认)"
  description: "KDJ 超卖反弹触发且 RSI < 50(双底背离过滤)"
  reliability: stable
  type: rule_tree
  inputs:
    - key: kdj_signal
      source: signal.kdj_oversold
      transform: boolean
    - key: rsi_value
      source: indicator.rsi
      transform: number
  combine: and
  thresholds:
    trigger: { expr: "kdj_signal && rsi_value < 50" }
  outputs:
    triggered: boolean
    score: number
  schedule: intraday
  user_acknowledged: true
  acknowledged_at: "2026-06-22"

- key: trend_breakout_filter
  name: "趋势突破过滤(MA + MACD 同向)"
  description: "突破 MA20 且 MACD 金叉(双趋势确认)"
  reliability: stable
  type: rule_tree
  inputs:
    - key: ma_signal
      source: signal.ma_breakout_above
      transform: boolean
    - key: macd_signal
      source: signal.macd_golden_cross
      transform: boolean
  combine: and
  thresholds:
    trigger: { expr: "ma_signal && macd_signal" }
  outputs:
    triggered: boolean
    score: number
  schedule: intraday
  user_acknowledged: true
  acknowledged_at: "2026-06-22"
