# MVP 优先级。先证明用户愿意少看盘，但相信助手会盯关键事项。
product_claim: "不是帮用户多看行情，而是帮用户只在该看的时候看；不是替用户买卖，而是帮用户按自己的规则做决定。"

P0:
  goal: "可用 MVP"
  scope:
    - "微信持仓录入和确认"
    - "日复盘生成与落盘"
    - "晚间微信简报"
    - "P0/P1/P2 盯盘提醒"
    - "操作确认单"
    - "memory/decisions.jsonl 观点记录"
  defer:
    - "复杂选股"
    - "月度自进化"
    - "多账户多组合"

P1:
  goal: "强化投资决策质量"
  scope:
    - "可靠行情和公告源"
    - "财报排雷卡片"
    - "观察池管理"
    - "周复盘回测日复盘观点"
    - "行为纠偏"

P2:
  goal: "产品护城河"
  scope:
    - "个性化投资方法沉淀"
    - "月度方法迭代"
    - "用户风格画像"
    - "观点命中率和失效归因"
    - "多组合、多账户管理"
    - "数据源可靠性评分"
