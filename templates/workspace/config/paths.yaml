# Node.js 长驻服务(invest-agent-ideal)负责的运行时边界。
# 服务只处理状态化、时间化和系统级职责;投资判断、风格、方法、记忆沉淀都在工作空间内。
runtime:
  host_service: "invest-agent-ideal"
  host_service_repo: "../../"
  host_service_responsibilities:
    - "微信登录、消息桥接和推送"
    - "调度器和盘中巡检"
    - "市场数据和公告抓取"
    - "SQLite 持久层(用户身份、绑定、aiProjects 注册、市场缓存、沙箱审计、推送任务、跟踪记录)"
    - "沙箱令牌签发与验证"
    - "仪表盘 GUI"
    - "本地 HTTP API"
  host_service_not_responsible_for:
    - "持仓结构、风格规则、方法、复盘产物(已迁移到工作空间 yaml/jsonl)"
    - "投资判断和方法论推理(由 Codex ACP 在工作空间内完成)"
