[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-assistant-template"
version = "0.1.0"
description = "Executable MVP core for a low-noise investment assistant template."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
invest-assistant = "invest_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
