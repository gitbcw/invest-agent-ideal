# 交易策略推荐评测集 - 输入 fixtures
#
# 设计说明(与 docs/trading-strategy-design.md §10.3 对齐):
#   - 评测稳定性优先:不依赖实时行情,每只股票配 "结构化上下文标签"
#   - 3 份策略分别对应趋势 / 反转 / 动量 三类逻辑,语义无重叠
#   - 5 只股票覆盖大盘/中盘/金融/新能源/成长,避免同质化
#
# AI 推理时只能依赖 strategies + stockContext 两个字段,不读行情。

strategies:
  - key: breakout-pullback
    name: 突破回踩
    applicability: 主板趋势股、波动率适中、有业绩支撑、均线多头排列
    body: |
      突破 20 日线且量比 > 1.5 时关注,回踩 20 日线不破进场。
      止损进场价 -5%,目标 +15%。

  - key: value-reversal
    name: 价值反转
    applicability: 低估蓝筹、行业龙头、PE/PB 处于历史低位、长期持有
    body: |
      PE < 历史中位数的 0.7 倍时分批进场,持有 6 个月以上。
      止损基于基本面恶化(不是价格),目标 +30%。

  - key: momentum-following
    name: 动量跟随
    applicability: 强势题材股、近期涨幅领先板块、量价配合、短线交易
    body: |
      近 5 日涨幅板块前 3 且量比持续 > 1.2 时进场,持有 3-10 天。
      止损 5 日均线跌破,目标 +8% 快速获利。

stocks:
  # 大盘消费龙头,长期持有属性,适合价值反转
  - code: "600519"
    name: 贵州茅台
    stockContext:
      sector: 白酒消费
      market_cap: 超大盘
      trend: 长期震荡偏强
      volatility: 低
      role: 防御性长期持有
      notes: 业绩稳定,PE 历史中位附近,适合基本面低吸

  # 中大盘成长,波动大,适合突破回踩
  - code: "300750"
    name: 宁德时代
    stockContext:
      sector: 新能源动力电池
      market_cap: 大盘成长
