suite:
  id: invest-agent-workflow-onboarding
  version: 1
  domain: Onboarding
  title: 新用户 Onboarding 全流程
  description: >
    创建一个全新的评测用户,通过同一个微信模拟会话连续走完新手引导。
    本套件验证业务流程闭环,不是单点黄金 case。

workflow:
  id: onboarding-full-001
  review_tier: business_flow
  priority: P0
  create_new_user: true
  user_id_prefix: eval-onboarding
  conversation_id_prefix: eval-onboarding-flow
  principles:
    - 必须以新用户/新 workspace 开始,不能复用已有用户残留状态
    - Onboarding 是连续业务流程,必须在同一会话内逐步推进状态
    - 持仓/观察仓、投资模型、复盘时间、盯盘时间、通知偏好、默认盯盘边界都必须各自确认
    - 用户自定义盯盘时间不能被默认 09:55 / 11:20 / 14:30 覆盖
    - 面向用户展示通知偏好,不要要求用户理解或选择 P0/P1/P2
  turns:
    - name: 开始引导
      user_input: 你好
      expected:
        must_contain:
          - 投资助手
          - 持仓
          - 自选
        must_not_contain:
          - Codex
          - ACP
          - P0
          - P1
          - P2

    - name: 提供持仓和观察仓
      user_input: 我持有赛轮轮胎、赣锋锂业，观察宁德时代和中际旭创。
      expected:
        must_contain:
          - 赛轮轮胎
          - 赣锋锂业
          - 宁德时代
          - 中际旭创
          - 确认
        must_not_contain:
          - 持仓数量
          - 持仓金额
          - 仓位价值

    - name: 确认持仓观察仓
      user_input: 确认
      expected:
        must_contain:
          - 已确认
          - 投资模型
        must_not_contain:
          - 未经确认
          - P0
          - P1
          - P2

    - name: 提供投资模型
      user_input: |
        我的投资方法是中线为主，先看行业景气度和公司基本面，再用技术面决定买卖点。
        买入看估值合理、趋势没有破坏；加仓看突破 20 日线后回踩 5 日线不破；
        卖出看顶部放量跌破 5 日线减仓，跌破 20 日线清仓。每天复盘主要检查持仓、观察股、风险事件和买卖计划。
      expected:
        must_contain:
          - 投资模型
          - 选股
          - 买入
          - 加仓
          - 卖出
          - 风控
          - 复盘
          - 确认
        must_not_contain:
          - 直接写入
          - 承诺收益

    - name: 确认投资模型
      user_input: 确认
      expected:
        must_contain:
          - 已确认
          - 复盘
          - 时间
        must_not_contain:
          - 未经确认
          - P0
          - P1
          - P2

    - name: 确认默认复盘时间
      user_input: 默认复盘时间可以
      expected:
        must_contain:
          - 已确认
          - 盯盘
          - 09:55
          - 11:20
          - 14:30
        must_not_contain:
          - P0
          - P1
          - P2

    - name: 自定义盯盘时间
      user_input: 每天9点20,9点50,11点20,13点20,14点30，帮我盯盘推送盘面信息
      expected:
        must_contain:
          - 09:20
          - 09:50
          - 11:20
          - 13:20
          - 14:30
          - 确认
        must_not_contain:
          - 按默认
          - P0
          - P1
          - P2

    - name: 确认盯盘时间
      user_input: 确认
      expected:
        must_contain:
          - 已确认
          - 通知偏好
          - 低打扰
        must_not_contain:
          - 09:55
          - P0
          - P1
          - P2

    - name: 选择低打扰通知
      user_input: 我选择低打扰
      expected:
        must_contain:
          - 低打扰
          - 默认盯盘
          - 确认
        must_not_contain:
          - P0
          - P1
          - P2
          - 自动批量创建

    - name: 确认默认盯盘边界
      user_input: 确认
      expected:
        must_contain:
          - 新手引导
          - 完成
          - 盯盘
        must_not_contain:
          - 自动批量创建
          - 均线提醒已创建
          - 价格提醒已创建

  final_expected:
    must_contain:
      - 新手引导
      - 完成
    must_not_contain:
      - P0
      - P1
      - P2
      - 未经确认直接写入
      - 自动批量创建

  workspace_expect:
    onboarding_status: completed
    market_watch_default_windows:
      - "09:20"
      - "09:50"
      - "11:20"
      - "13:20"
      - "14:30"
