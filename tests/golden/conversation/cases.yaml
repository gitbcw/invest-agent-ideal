  - id: strategy-004
    category: core_golden
    review_tier: golden_core
    priority: P0
    scenario: trading_strategy_indicator_draft
    tags: [strategy, indicator, signal, confirmation]
    principles:
      - 用户输入复杂交易策略和指标想法时,必须整理成交易策略草案 + 指标信号草案,而不是直接落库或直接声称已能发信号
      - 必须保留口诀和核心变量:25日均线、5日均量线、60日均量线、弱量假突破、量价企稳、卖出信号
      - 指标化要区分建仓、波段/加仓、低吸、预警、卖出和假突破过滤条件
      - 启用策略或指标前必须等待用户确认,不能直接套到某只股票或承诺胜率
    user_input: |
      下面这套交易策略帮我记下来,两个结合一下,看看能不能做成信号发出的指标:

      记6个字:冲量试错，做量上车，缩量吃饱。
      25均线是股价生命线，5日均量线是主力油门，60日均量线是市场油箱。

      1句弱量之下是假突破，5日均量线趴在60日均量线下时都是诱多，无量冲锋都是看空。
      2句金叉起爆回踩就是干，股价回踩或轻轻刺破25日线，同时5日均量线从下往上金叉60日均量线，这是短线最确定的起爆信号，冲量进场，错了小亏，对了大赚。
      3句股价回调到25日线附近，5日和60日均量线贴在一起，成交量缩到地量，这是趋势确认后加仓点。
      4句股价涨完一波，回调到25日均线上，5日线在60线上，主力没出完，单日成交量缩到60日均量线以下，低吸。

      1，5日均量线长期在60日均量线下，保持不动，短暂上涨也是假突破。
      2，股价突破25日均线，同时5日均量线上穿60日均量线可以建仓。
      3，股价回踩25日均价线，5日均量线回踩60日均量线，量价企稳，适合波段操作。
      4，股价回踩25日均线，5日均量线在60日均量线上方运行一段时间，股价回缩到60日均量线下方，可以进场，适合长线。
      5，股价跌5日线发出预警，跌穿14日发出卖出信号，60日均量线下穿5日线全部卖出。
    expected:
      must_contain:
        - 交易策略草案
        - 指标信号草案
        - 冲量试错，做量上车，缩量吃饱
        - 25日均线
        - 5日均量线
        - 60日均量线
        - 假突破过滤
        - 建仓信号
        - 波段或加仓信号
        - 低吸信号
        - 预警信号
        - 卖出信号
        - 等待用户确认
      must_not_contain:
        - 未经确认直接写入策略
        - 未经确认直接创建指标
        - 直接套到某只股票
        - 直接发出买入建议
        - 承诺胜率
        - 承诺收益
        - 仓位上限
        - 持仓金额
      style_notes: >
        应把自然语言口诀拆成可执行策略和 L2/L3a 指标候选:先给草案、信号分层、
        数据需求和待确认项;不能直接创建指标或给出具体股票买卖建议。

