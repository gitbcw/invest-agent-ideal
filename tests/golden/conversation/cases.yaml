        - 最近触发提醒
        - 当前数据缺口
        - 人工交易预案
        - 把待确认规则和方法论候选混淆
        - 主动起草新的提醒规则
      style_notes: 查提醒规则只能返回用户显式设置的个股提醒和巡检间隔,不能混入系统默认规则或最近触发历史

