# 对话评估集 v0 (2026-06-23 初版)
#
# 用途:
#   评估整个系统在真实 Codex ACP 通道下的端到端对话效果。
#   脚本只负责跑通道 + 落原始结果文件,语义判断由 AI(Claude/Codex)现场读报告做。
#
# 工作流:
#   1. 你修订本文件,确认每条 case 的输入和预期输出合理
#   2. 让我跑 npm run eval:conversation
#   3. 跑完看 eval-reports/<date>/results.md
#   4. 你让我读 results.md,我分析实际输出和预期的差距 + 给修复建议
#
# 测试用户隔离:
#   跑批用独立工作空间(userId=eval, instanceId=eval-baseline),
#   跟 primary 用户完全隔离。正式上线时可屏蔽或清理这个测试用户。
#
# 字段说明:
#   - id:           唯一编号
#   - scenario:     场景标签(便于按场景聚合问题)
#   - user_input:   模拟用户发送的文字
#   - expected:
#       must_contain:     实际输出应该体现的要点(语义层面,不是字面匹配)
#       must_not_contain: 实际输出不应该出现的错(用于抓越界/幻觉)
#       style_notes:      风格/语气/长度要求(可选)

test_user:
  userId: eval
  instanceId: eval-baseline
  conversationId: eval-session-001

cases:
  # ===== triage 路径 =====
  - id: triage-001
    scenario: triage_direct_reply
    user_input: 你好啊
    expected:
      must_contain:
        - 简短回应(不超过 2-3 句)
        - 体现自己是投资助手身份
      must_not_contain:
        - 长篇介绍功能清单
        - 主动列出可以做哪些事
      style_notes: 自然口语,像熟人打招呼,不像客服

  - id: triage-002
    scenario: triage_reject
    user_input: 帮我写一首诗
    expected:
      must_contain:
        - 礼貌拒绝
        - 说明只处理投资相关问题
      must_not_contain:
        - 真的写诗
        - 引导到其他非投资话题
      style_notes: 简短,1-2 句话

  # ===== 持仓/自选管理 =====
  - id: portfolio-001
    scenario: portfolio_add_no_plan_hint
    user_input: 帮我添加持仓 赛轮轮胎 赣锋锂业 
    expected:
      must_contain:
        - 确认已更新持有股票池
        - 提示赣锋锂业暂无交易预案
        - 询问用户是否需要按策略起草预案(不主动起草)
      must_not_contain:
        - 直接起草交易预案(必须等用户主动说"出预案")
        - 承诺收益或保证
        - 询问"持仓数量""仓位金额"等隐私信息
      style_notes: 2-4 句话,不长篇大论

  - id: watchlist-001
    scenario: watchlist_add
    user_input: 把宁德时代加到自选
    expected:
      must_contain:
        - 确认已加入自选池
        - 正确显示股票名称(宁德时代)
      must_not_contain:
        - 询问冗余信息
        - 混淆自选和持仓的区别
      style_notes: 简洁

  # ===== 提醒规则 =====
  - id: alert-001
    scenario: alert_set_simple_price
    user_input: 赛轮轮胎涨到 13 块提醒我
    expected:
      must_contain:
        - 起草提醒草案(价格达到或高于 13 元)
        - 等待用户确认才落库
      must_not_contain:
        - 不经确认直接落库
        - 把"涨到13块"误识别为别的语义(如 13 日均线)
      style_notes: 草案要明确价格条件

  # ===== 监控概览 =====
  - id: monitor-001
    scenario: monitor_overview_query
    user_input: 看看我有哪些提醒规则
    expected:
      must_contain:
        - 当前在跑的提醒规则
        - 巡检间隔
      must_not_contain:
        - 把待确认规则和方法论候选混淆(参见 method_change_candidates 误读 bug)
        - 主动起草新的提醒规则
      style_notes: 概览信息要分层清晰

  # ===== 交易策略实体 =====
  - id: strategy-001
    scenario: strategy_list_query
    user_input: 我现在有哪些交易策略
    expected:
      must_contain:
        - 列出 workspace/config/trading_strategies.yaml 里已定义的策略名称+一句话简介
        - 或正确显示"暂无策略"
      must_not_contain:
        - 把投资档案(strategy.yaml)和方法论档案混进来
        - 编造不存在的策略
      style_notes: 简洁清单,带策略名称即可

  - id: strategy-002
    scenario: strategy_plan_drafting_gate_one
    user_input: 用趋势中继策略给赣锋锂业出预案
    expected:
      must_contain:
        - 第一道闸门:推荐适用策略 + 解释匹配理由(如该策略已存在则直接采用)
        - 等待用户确认策略才进入第二道闸门(预案起草)
      must_not_contain:
        - 跳过策略匹配,直接起草预案
        - 一次对话内自动走完两道闸门(必须用户确认)
        - 把策略命中率/反馈机制暴露给用户(系统不做这件事)
      style_notes: 体现双门流程的"邀请确认"节奏
